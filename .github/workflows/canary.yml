name: Canary

# Early warning, not a gate: runs the built plugin against the newest Tailwind
# release and the insiders build. Consumers float on `^4.x`, so they get a new
# Tailwind before this repo's pinned dev dependency does — engine changes such as
# new canonical rewrites or stricter modifier validation show up here first.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Tailwind ${{ matrix.tailwind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tailwind: ['latest', 'insiders']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke against tailwindcss@${{ matrix.tailwind }}
        run: node scripts/engine-smoke.mjs ${{ matrix.tailwind }}
