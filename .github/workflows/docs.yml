name: Docs

# Build-check only. The production deploy to Cloudflare Pages lives in
# release.yml (push to `release`). This job just proves the docs site still
# compiles before a PR lands on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full history: VitePress reads each page's last-modified time from git
      # (lastUpdated, sitemap lastmod). A shallow clone would stamp every page
      # with the release commit's time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No `version:` input on purpose: the action reads `packageManager` from
      # package.json, and pinning both makes it fail hard with "Multiple versions
      # of pnpm specified" the moment the two drift apart.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Library build is a prerequisite — generate-rules.ts reads dist/index.cjs.
      - name: Build library
        run: pnpm -C packages/oxlint-tailwindcss build

      - name: Generate rule pages
        run: pnpm -C packages/docs generate

      - name: Build docs site
        run: pnpm -C packages/docs build
