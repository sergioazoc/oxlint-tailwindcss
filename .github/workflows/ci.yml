name: CI

on:
  push:
    branches: [main]
  pull_request:
    # PRs into main, plus PRs that merge main -> release. Pushes to release
    # are gated separately by release.yml, which re-runs these same checks
    # before publishing.
    branches: [main, release]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # See all platform/version failures at once instead of stopping early.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Node 20 is intentionally not in the CI matrix: the dev toolchain can't
        # run there (tsdown needs ^22.18 || ^24.11 || >=26, vitest ^22.12 ||
        # ^24 || >=26). The published plugin's runtime only uses
        # worker_threads/Atomics/fs and still supports Node 20 (per package
        # `engines`); this matrix verifies the toolchain-supported versions.
        node-version: [22, 24, 26]
        # The sync-loader relies on Atomics, file-locks (openSync 'wx'),
        # os.tmpdir() and worker_threads, which are platform-sensitive. Cover
        # macOS and Windows on the primary Node version so the cross-platform
        # paths are exercised without exploding the matrix. The workflow steps
        # are pnpm-driven (no raw unix-only shell), so they run on Windows too.
        include:
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input on purpose: the action reads `packageManager` from
      # package.json, and pinning both makes it fail hard with "Multiple versions
      # of pnpm specified" the moment the two drift apart.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      # Type-aware lint (tsgolint) over the plugin source only. The linux binary
      # resolves via oxlint-tsgolint's optionalDependencies; the curated error
      # set (no-floating-promises, etc.) is scoped to src/**/*.ts in .oxlintrc.json.
      # Deliberately NOT in release.yml — releases stay decoupled from this gate.
      - name: Type-aware lint
        run: pnpm lint:types

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Unit tests of the corpus benchmark's normalizer and comparer. They import
      # only bench/lib, so they need no `npm ci` in bench/ and no network.
      - name: Test bench harness
        run: node --test "bench/test/*.test.mjs"

      - name: Verify package
        run: pnpm -C packages/oxlint-tailwindcss pack

  # Real-engine smoke: the plugin resolves and runs the CONSUMER's Tailwind, not
  # its own bundled copy (#114). The main suite simulates versions via injection
  # and fake trees; this installs an actual older v4 line and drives the built
  # plugin through the real oxlint binary. Kept separate so a registry hiccup
  # can't block the main matrix. Assertions are coarse — class lists and order
  # shift across versions, so only the guard verdict + rule firing are checked.
  engine-matrix:
    name: Smoke — Tailwind ${{ matrix.tailwind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.1 is the supported floor: 4.0.x lacks `ds.canonicalizeCandidates`
        # (the version guard fails those loud). Test the older supported lines.
        tailwind: ['4.1', '4.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke against tailwindcss ${{ matrix.tailwind }}
        run: node scripts/engine-smoke.mjs ${{ matrix.tailwind }}
