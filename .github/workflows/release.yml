name: Release

on:
  push:
    branches: [release]

# Serialize releases: never run two publish/deploy passes at once, and never
# cancel an in-flight one (a half-published release is worse than a queued one).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      deployments: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.4.0

      # No registry-url: it would write an .npmrc with an empty authToken,
      # which interferes with OIDC. npm defaults to registry.npmjs.org, where
      # the trusted publisher is configured.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      # Pin to the 11.x major so a future npm 12 with breaking publish behavior
      # can't slip in unreviewed.
      - name: Update npm for OIDC publishing
        run: npm install -g npm@11

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # --- Docs: always build and deploy on a release push ---
      - name: Build docs site
        run: pnpm -C packages/docs build

      - name: Deploy docs to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:
            pages deploy packages/docs/.vitepress/dist --project-name=oxlint-tailwindcss
            --branch=release

      # --- npm: publish only when this version isn't on the registry yet ---
      # A docs-only release (no version bump) deploys the site above but skips
      # the publish, instead of failing on npm's "version already exists".
      - name: Check published version
        id: version
        run: |
          LOCAL=$(node -p 'require("./packages/oxlint-tailwindcss/package.json").version')
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          if npm view "oxlint-tailwindcss@$LOCAL" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL already on npm — skipping publish + release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL not on npm — will publish."
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        # Trusted publishing (OIDC): no NODE_AUTH_TOKEN — npm exchanges the
        # GitHub Actions id-token for a short-lived publish credential, against
        # the trusted publisher configured for this repo + workflow on npmjs.com.
        # Provenance is generated automatically. Publish via npm directly (not
        # `pnpm publish`, which forwards its own flags and trips npm's EUSAGE).
        run: npm publish --provenance --access public
        working-directory: packages/oxlint-tailwindcss

      - name: Create or update GitHub Release
        if: steps.version.outputs.published == 'false'
        run: |
          VERSION="v${{ steps.version.outputs.local }}"
          # Match the heading whether or not it carries a date suffix:
          # both "## 1.0.0" and "## 0.8.0 (2026-05-17)" extract correctly.
          BODY=$(awk -v v="${{ steps.version.outputs.local }}" '$0 ~ "^## " v "( |$)" {found=1; next} /^## / {found=0} found' packages/oxlint-tailwindcss/CHANGELOG.md)
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes "$BODY" --target "$GITHUB_SHA"
          else
            gh release create "$VERSION" --title "$VERSION" --notes "$BODY" --target "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
