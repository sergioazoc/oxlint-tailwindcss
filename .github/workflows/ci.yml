name: CI

on:
  push:
    branches: [main]
  pull_request:
    # PRs into main, plus PRs that merge main -> release. Pushes to release
    # are gated separately by release.yml, which re-runs these same checks
    # before publishing.
    branches: [main, release]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify package
        run: pnpm -C packages/oxlint-tailwindcss pack
