name: Docs

# Build-check only. The production deploy to Cloudflare Pages lives in
# release.yml (push to `release`). This job just proves the docs site still
# compiles before a PR lands on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Library build is a prerequisite — generate-rules.ts reads dist/index.cjs.
      - name: Build library
        run: pnpm -C packages/oxlint-tailwindcss build

      - name: Generate rule pages
        run: pnpm -C packages/docs generate

      - name: Build docs site
        run: pnpm -C packages/docs build
