name: CI

on:
  push:
    branches: [main]
  pull_request:
    # PRs into main, plus PRs that merge main -> release. Pushes to release
    # are gated separately by release.yml, which re-runs these same checks
    # before publishing.
    branches: [main, release]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # See all platform/version failures at once instead of stopping early.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Node 20 is intentionally not in the CI matrix: the dev toolchain
        # (pnpm 11.4) fails to even start under Node 20 (ERR_UNKNOWN_BUILTIN_MODULE),
        # so it can't be exercised here. The published plugin's runtime only uses
        # worker_threads/Atomics/fs and still supports Node >=20 (per package
        # `engines`); this matrix verifies the toolchain-supported versions.
        node-version: [22, 24]
        # The sync-loader relies on Atomics, file-locks (openSync 'wx'),
        # os.tmpdir() and worker_threads, which are platform-sensitive. Cover
        # macOS and Windows on the primary Node version so the cross-platform
        # paths are exercised without exploding the matrix. The workflow steps
        # are pnpm-driven (no raw unix-only shell), so they run on Windows too.
        include:
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify package
        run: pnpm -C packages/oxlint-tailwindcss pack
