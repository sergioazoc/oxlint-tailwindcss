name: Docs

# Build-check only. The production deploy to Cloudflare Pages lives in
# release.yml (push to `release`). This job just proves the docs site still
# compiles before a PR lands on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.4.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Library build is a prerequisite — generate-rules.ts reads dist/index.cjs.
      - name: Build library
        run: pnpm -C packages/oxlint-tailwindcss build

      - name: Generate rule pages
        run: pnpm -C packages/docs generate

      - name: Build docs site
        run: pnpm -C packages/docs build
