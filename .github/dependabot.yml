version: 2
updates:
  # Keep the pinned GitHub Actions (by SHA) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Root workspace dependencies (oxlint/oxfmt catalog tooling, etc.).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  # The published plugin package.
  - package-ecosystem: npm
    directory: /packages/oxlint-tailwindcss
    schedule:
      interval: weekly

  # The docs site. Missing here until now, which is why VitePress was the one
  # dependency that never got an automated bump — every other package in the
  # workspace has had one.
  - package-ecosystem: npm
    directory: /packages/docs
    schedule:
      interval: weekly
