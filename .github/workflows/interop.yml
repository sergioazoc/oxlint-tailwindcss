name: Interop

# Early warning, not a gate: checks the pages that name other plugins against
# them (bench/interop.mjs) — /shadcn's table and combined config against
# @shadcn/lint, /migration/from-better-tailwindcss's rule map against
# eslint-plugin-better-tailwindcss — with the versions the pages name (pinned in
# bench/package-lock.json) and with their latest releases. A red run means a
# page needs updating, or that one of them changed what it reports.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    name: 'Other plugins, ${{ matrix.versions }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        versions: ['pinned', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install the bench
        working-directory: bench
        run: npm ci

      - name: Use their latest releases
        if: matrix.versions == 'latest'
        working-directory: bench
        run: npm install --no-save @shadcn/lint@latest eslint-plugin-better-tailwindcss@latest

      - name: Check the pages against them
        working-directory: bench
        run: node interop.mjs
