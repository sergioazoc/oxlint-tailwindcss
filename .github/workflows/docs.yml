name: Docs

# Build-check only. The production deploy to Cloudflare Pages lives in
# release.yml (push to `release`). This job just proves the docs site still
# compiles before a PR lands on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Library build is a prerequisite — generate-rules.ts reads dist/index.cjs.
      - name: Build library
        run: pnpm -C packages/oxlint-tailwindcss build

      - name: Generate rule pages
        run: pnpm -C packages/docs generate

      - name: Build docs site
        run: pnpm -C packages/docs build
