name: CI

on:
  push:
    branches: [main]
  pull_request:
    # PRs into main, plus PRs that merge main -> release. Pushes to release
    # are gated separately by release.yml, which re-runs these same checks
    # before publishing.
    branches: [main, release]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # See all platform/version failures at once instead of stopping early.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Node 20 is intentionally not in the CI matrix: pnpm itself declares
        # `engines.node >=22.13` (unchanged from 11.4 through 11.20), so the dev
        # toolchain cannot even start there. The published plugin's runtime only
        # uses worker_threads/Atomics/fs and still supports Node >=20 (per package
        # `engines`); this matrix verifies the toolchain-supported versions.
        node-version: [22, 24]
        # The sync-loader relies on Atomics, file-locks (openSync 'wx'),
        # os.tmpdir() and worker_threads, which are platform-sensitive. Cover
        # macOS and Windows on the primary Node version so the cross-platform
        # paths are exercised without exploding the matrix. The workflow steps
        # are pnpm-driven (no raw unix-only shell), so they run on Windows too.
        include:
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 22

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # No `version:` input on purpose: the action reads `packageManager` from
      # package.json, and pinning both makes it fail hard with "Multiple versions
      # of pnpm specified" the moment the two drift apart.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify package
        run: pnpm -C packages/oxlint-tailwindcss pack

  # Real-engine smoke: the plugin resolves and runs the CONSUMER's Tailwind, not
  # its own bundled copy (#114). The main suite simulates versions via injection
  # and fake trees; this installs an actual older v4 line and drives the built
  # plugin through the real oxlint binary. Kept separate so a registry hiccup
  # can't block the main matrix. Assertions are coarse — class lists and order
  # shift across versions, so only the guard verdict + rule firing are checked.
  engine-matrix:
    name: Smoke — Tailwind ${{ matrix.tailwind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.1 is the supported floor: 4.0.x lacks `ds.canonicalizeCandidates`
        # (the version guard fails those loud). Test the older supported lines.
        tailwind: ['4.1', '4.2']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke against tailwindcss ${{ matrix.tailwind }}
        run: node scripts/engine-smoke.mjs ${{ matrix.tailwind }}
