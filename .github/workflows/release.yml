name: Release

on:
  push:
    branches: [release]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # --- Docs: always build and deploy on a release push ---
      - name: Build docs site
        run: pnpm -C packages/docs build

      - name: Deploy docs to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/docs/.vitepress/dist --project-name=oxlint-tailwindcss --branch=release

      # --- npm: publish only when this version isn't on the registry yet ---
      # A docs-only release (no version bump) deploys the site above but skips
      # the publish, instead of failing on npm's "version already exists".
      - name: Check published version
        id: version
        run: |
          LOCAL=$(node -p 'require("./packages/oxlint-tailwindcss/package.json").version')
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          if npm view "oxlint-tailwindcss@$LOCAL" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL already on npm — skipping publish + release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL not on npm — will publish."
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: pnpm -C packages/oxlint-tailwindcss publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create or update GitHub Release
        if: steps.version.outputs.published == 'false'
        run: |
          VERSION="v${{ steps.version.outputs.local }}"
          BODY=$(awk "/^## ${VERSION#v} /{found=1; next} /^## /{found=0} found" packages/oxlint-tailwindcss/CHANGELOG.md)
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes "$BODY" --target "$GITHUB_SHA"
          else
            gh release create "$VERSION" --title "$VERSION" --notes "$BODY" --target "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
