packages:
  - 'packages/*'
catalog:
  '@oxlint/plugins': ^1.69.0
  oxfmt: ^0.55.0
  oxlint: ^1.69.0
allowBuilds:
  esbuild: true
  # wrangler-action runs `pnpm add wrangler` for the Cloudflare Pages deploy;
  # wrangler pulls workerd, whose build script pnpm 11.4 would otherwise treat
  # as an undecided build and fail with ERR_PNPM_IGNORED_BUILDS. We don't need
  # workerd compiled for a static Pages upload — `false` skips it without error.
  workerd: false
